name: Independent registry credential audit
on:
  workflow_dispatch:
permissions: {}
jobs:
  auth0:
    if: github.actor == 'prekucki' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Independent authentication check and PGP encryption
        shell: python
        env:
          REGISTRY_TARGET: '{"ticket": "GF-022", "repository": "golemfactory/golem-sdk-registry-images", "scope": "repository", "secret": "REGISTRY_TOKEN", "service": "Golem Registry", "registry": "registry.golem.network", "username_secret": "REGISTRY_USER"}'
          S_REGISTRY_PASSWORD: ${{ secrets.REGISTRY_TOKEN }}
          S_REGISTRY_USERNAME: ${{ secrets.REGISTRY_USER }}
          RECIPIENT_PUBLIC_KEY: |
            -----BEGIN PGP PUBLIC KEY BLOCK-----
            
            mDMEabVMBhYJKwYBBAHaRw8BAQdAgNyP72YIPei5lx0Yx18JyZg0hQihgpNLxKFC
            MoUbhZq0KFByemVteXPFgmF3IEsuIFJla3Vja2kgPHByZWt1Y2tpQHJjbC5wbD6I
            jgQTFgoANhYhBAypyQBWvQEVWkRhwulqQfSt3vsZBQJptUwGAhsBBAsJCAcEFQoJ
            CAUWAgMBAAIeBQIXgAAKCRDpakH0rd77GYUoAQClNUfI9SjJLrX9Afz8s9Tn3j5m
            R+l4F4kwNzB0OvnN8gD/SYVzhrRMJmkzq+5g1VBO5p/8u6UxTQ9/g9xkh5j5BwG4
            MwRptUzYFgkrBgEEAdpHDwEBB0CjM9B6HeFmN8doNuFALDTM6TeGNLqfhEasRr7Y
            b8SKvoj1BBgWCgAmFiEEDKnJAFa9ARVaRGHC6WpB9K3e+xkFAmm1TNgCGwIFCQHh
            M4AAgQkQ6WpB9K3e+xl2IAQZFgoAHRYhBAykLYQdY6f9k+SX4jcnmKnwzNTfBQJp
            tUzYAAoJEDcnmKnwzNTfUDABAKVV11fUeII7Vhsqvsz0qSERfBjfWeBUa3E6ePD9
            QJnQAQCrWe3HL5q6OBATOG8UvaEhQ2Xu5m8RyHbisn6nEnssDmdlAQDQM9kaX7QR
            luj6iqtkijlQ2mhEV2gboayosOUAijyXswD/XaajRmoYqs+rIz7XVkUX7ADWqMKy
            9/Q/5+HIR86PxAy4MwRptU0jFgkrBgEEAdpHDwEBB0BlX13377375AXDEd0PPf3/
            AUSSQQWWCFIUshLJJADvBIh+BBgWCgAmFiEEDKnJAFa9ARVaRGHC6WpB9K3e+xkF
            Amm1TSMCGyAFCQWjmoAACgkQ6WpB9K3e+xlDqwD+OpWsrKTpPip/5Pz6aBuxVlsP
            hSrozqDDpIcSsBvkQsIA/0Jqe/dAJAeCSzITbMFVJ8XIMHe47fYCwG7SRiVi++UP
            uDgEabfhxxIKKwYBBAGXVQEFAQEHQJml1IqN4q8gUUp8RmdVJFwmx4NkZCPbqPED
            PGMbi74qAwEIB4h+BBgWCgAmFiEEDKnJAFa9ARVaRGHC6WpB9K3e+xkFAmm34ccC
            GwwFCQlmAYAACgkQ6WpB9K3e+xnqNwEA9hbDb4KdtgKnCPqTFRM4BJOUEtBz7tT1
            VZNIafR28vEA/A1OvCGnLrTor+M5k6iJX9lkisCVdoPiZDq+j0Q+X6EL
            =VOH7
            -----END PGP PUBLIC KEY BLOCK-----
        run: |
          import datetime as dt
          import io,json,os,re,secrets,subprocess,tarfile,tempfile
          from pathlib import Path
          FPR='0CA9C90056BD01155A4461C2E96A41F4ADDEFB19'
          import urllib.request,urllib.error,base64
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self,req,fp,code,msg,headers,newurl):return None
          def request(url,headers=None,data=None):
              req=urllib.request.Request(url,headers=headers or {},data=data,method='POST' if data is not None else 'GET')
              try:
                  with urllib.request.build_opener(NoRedirect).open(req,timeout=20) as r:
                      body=r.read(65537)
                      if len(body)>65536:return {'status':'INCONCLUSIVE_RESPONSE_TOO_LARGE'}
                      return {'status':'AUTHENTICATED','http_status':r.status,'body':json.loads(body)}
              except urllib.error.HTTPError as e:return {'status':'REJECTED_CREDENTIAL' if e.code==401 else 'DENIED_NOT_PROOF_OF_REVOCATION' if e.code==403 else 'INCONCLUSIVE_HTTP_ERROR','http_status':e.code}
              except (urllib.error.URLError,TimeoutError,OSError):return {'status':'INCONCLUSIVE_TRANSPORT_ERROR'}
          
          def login(registry,user,password):
              clean={k:v for k,v in os.environ.items() if not k.startswith('S_REGISTRY_') and k not in {'DOCKER_CONFIG','DOCKER_AUTH_CONFIG','DOCKER_HOST','DOCKER_CONTEXT','DOCKER_TLS_VERIFY','DOCKER_CERT_PATH'}}
              with tempfile.TemporaryDirectory(prefix='registry-auth-',dir=os.environ['RUNNER_TEMP']) as folder:
                  Path(folder,'config.json').write_text('{"auths":{},"credsStore":"","credHelpers":{}}')
                  try:
                      p=subprocess.run(['docker','--config',folder,'login',registry,'--username',user,'--password-stdin'],input=password+'\n',text=True,capture_output=True,timeout=35,env=clean)
                  except subprocess.TimeoutExpired:return 'INCONCLUSIVE_TIMEOUT'
                  if p.returncode==0 and 'Login Succeeded' in p.stdout:return 'AUTHENTICATED'
                  text=(p.stdout+' '+p.stderr).lower()
                  if any(s in text for s in ['unauthorized:','incorrect username or password','invalid username or password','invalid token']):return 'REJECTED_CREDENTIAL'
                  if any(s in text for s in ['denied','forbidden','403']):return 'DENIED_NOT_PROOF_OF_REVOCATION'
                  return 'INCONCLUSIVE_LOGIN_ERROR'
          def probe(t):
              base={k:t[k] for k in ['ticket','repository','scope','secret','service']}
              pw=os.environ.get('S_REGISTRY_PASSWORD','');user=os.environ.get('S_REGISTRY_USERNAME','').strip()
              if not pw:return base|{'status':'MISSING_SECRET'}
              if not user:return base|{'status':'MISSING_USERNAME'}
              url='https://registry.golem.network/auth/pat/login'
              def auth(password):return request(url,{'Content-Type':'application/json','Accept':'application/json','User-Agent':'independent-incident-check'},json.dumps({'username':user,'password':password}).encode())
              control=auth('invalid-incident-control-'+secrets.token_hex(24))
              if control['status']!='REJECTED_CREDENTIAL':return base|{'status':'INCONCLUSIVE_NEGATIVE_CONTROL','negative_control':control['status']}
              response=auth(pw);data=response.pop('body',None)
              if response['status']=='AUTHENTICATED' and not (isinstance(data,dict) and isinstance(data.get('access_token'),str) and isinstance(data.get('refresh_token'),str)):
                  response['status']='INCONCLUSIVE_RESPONSE_ERROR'
              # Returned JWTs are deliberately discarded; never reused, printed or reported.
              return base|response|{'configured_username':user,'registry':'registry.golem.network','negative_control':control['status'],'tested_operation':'POST /auth/pat/login only; returned session tokens discarded','scope_limit':'PAT authentication only. No image operations, permission probes, token changes or authenticated follow-up calls.'}
          def main():
              os.umask(0o077);target=json.loads(os.environ['REGISTRY_TARGET'])
              try:result=probe(target)
              except Exception as e:result={k:target[k] for k in ['ticket','repository','scope','secret','service']}|{'status':'INCONCLUSIVE_DIAGNOSTIC_ERROR','error_type':type(e).__name__}
              report={'repository':target['repository'],'scope':target['scope'],'recipient_fingerprint':FPR,'checked_at':dt.datetime.now(dt.timezone.utc).isoformat(),'result':result,'security':'Independent code only; no checkout or repository code execution. Authentication against a verified provider only. No images pulled, pushed or built. Secret values and raw diagnostic output omitted.'}
              archive=io.BytesIO()
              with tarfile.open(fileobj=archive,mode='w:gz') as tar:
                  for name,content in [('report.md',('# Registry credential verification\n\n```json\n'+json.dumps(report,indent=2)+'\n```\n').encode()),('report.json',json.dumps(report,indent=2).encode())]:
                      info=tarfile.TarInfo(name);info.mode=0o600;info.size=len(content);tar.addfile(info,io.BytesIO(content))
              output='registry-'+target['repository'].split('/')[1]+'-'+target['secret'].lower()
              clean={k:v for k,v in os.environ.items() if not k.startswith('S_REGISTRY_')}
              with tempfile.TemporaryDirectory(prefix='registry-pgp-',dir=os.environ['RUNNER_TEMP']) as home:
                  cmd=['gpg','--homedir',home,'--batch'];subprocess.run(cmd+['--import'],input=os.environ['RECIPIENT_PUBLIC_KEY'].encode(),capture_output=True,check=True,env=clean)
                  key=subprocess.run(cmd+['--with-colons','--fingerprint',FPR],capture_output=True,text=True,check=True,env=clean)
                  assert next(l.split(':')[9] for l in key.stdout.splitlines() if l.startswith('fpr:'))==FPR
                  subprocess.run(cmd+['--yes','--trust-model','always','--recipient',FPR,'--output',str(Path(os.environ['RUNNER_TEMP'])/(output+'.tar.gz.gpg')),'--encrypt'],input=archive.getvalue(),capture_output=True,check=True,env=clean)
              public={k:report[k] for k in ['repository','scope','checked_at','recipient_fingerprint']};public['result']={k:result[k] for k in ['ticket','repository','scope','secret','service','status']}
              (Path(os.environ['RUNNER_TEMP'])/(output+'-summary.json')).write_text(json.dumps(public,indent=2))
              print('Authentication check completed; account details encrypted to pinned owner PGP. No repository code executed and no images accessed.')
          if __name__=='__main__':main()
      - name: Upload encrypted report and status only
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: registry-golem-sdk-registry-images-registry_token
          path: |
            ${{ runner.temp }}/registry-golem-sdk-registry-images-registry_token.tar.gz.gpg
            ${{ runner.temp }}/registry-golem-sdk-registry-images-registry_token-summary.json
          if-no-files-found: error
          retention-days: 1
